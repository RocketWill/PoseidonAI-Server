<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" role="img" aria-labelledby="title desc">
  <title id="title">PoseidonAI workflow</title>
  <desc id="desc">A workflow from dataset preparation through training, evaluation, visualization, export, and runtime integration.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#13c2c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f2937" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 24px Inter,Arial,sans-serif;fill:#172033}.step{font:700 16px Inter,Arial,sans-serif;fill:#172033}.detail{font:400 13px Inter,Arial,sans-serif;fill:#667085}.number{font:700 14px Inter,Arial,sans-serif;fill:#fff}.line{stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="300" rx="24" fill="#f7f9fc"/>
  <text x="48" y="50" class="title">From dataset to deployable model</text>
  <g filter="url(#shadow)">
    <g transform="translate(48 88)"><rect width="190" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">1</text><text x="20" y="77" class="step">Dataset</text><text x="20" y="104" class="detail">Upload, annotate,</text><text x="20" y="124" class="detail">inspect distributions</text></g>
    <g transform="translate(276 88)"><rect width="190" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">2</text><text x="20" y="77" class="step">Configure</text><text x="20" y="104" class="detail">Model, split, epochs,</text><text x="20" y="124" class="detail">optimizer, GPU</text></g>
    <g transform="translate(504 88)"><rect width="190" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">3</text><text x="20" y="77" class="step">Train</text><text x="20" y="104" class="detail">Queued execution,</text><text x="20" y="124" class="detail">status and loss tracking</text></g>
    <g transform="translate(732 88)"><rect width="190" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">4</text><text x="20" y="77" class="step">Evaluate</text><text x="20" y="104" class="detail">Metrics and validation</text><text x="20" y="124" class="detail">prediction review</text></g>
    <g transform="translate(960 88)"><rect width="190" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">5</text><text x="20" y="77" class="step">Export</text><text x="20" y="104" class="detail">Model and runtime</text><text x="20" y="124" class="detail">package options</text></g>
    <g transform="translate(1188 88)"><rect width="204" height="150" rx="16" fill="#fff"/><circle cx="28" cy="28" r="17" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">6</text><text x="20" y="77" class="step">Integrate</text><text x="20" y="104" class="detail">Python, C#, and C++</text><text x="20" y="124" class="detail">runtime guidance</text></g>
  </g>
  <path d="M238 163H266" class="line"/><path d="M466 163H494" class="line"/><path d="M694 163H722" class="line"/><path d="M922 163H950" class="line"/><path d="M1150 163H1178" class="line"/>
</svg>
